name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.12 is the minimum version declared in go.mod.
        go: ["1.12", "oldstable", "stable"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Check go mod tidy
        if: matrix.go != '1.12'
        run: |
          go mod tidy
          git diff --exit-code go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests (Go 1.12)
        if: matrix.go == '1.12'
        run: go test -v -race ./...

      - name: Run tests
        if: matrix.go != '1.12'
        run: go test -v -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.go == 'stable'
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
